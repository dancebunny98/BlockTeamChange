name: Build BlockTeamChange

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BlockTeamChange.csproj

      - name: Build
        run: dotnet build BlockTeamChange.csproj -c Release --no-restore

      - name: Package plugin folder
        run: |
          set -eu
          PKG_DIR="dist/BlockTeamChange"
          mkdir -p "$PKG_DIR"
          cp bin/Release/net8.0/BlockTeamChange.dll "$PKG_DIR/"
          if [ -f bin/Release/net8.0/BlockTeamChange.deps.json ]; then
            cp bin/Release/net8.0/BlockTeamChange.deps.json "$PKG_DIR/"
          fi
          if [ -f bin/Release/net8.0/BlockTeamChange.pdb ]; then
            cp bin/Release/net8.0/BlockTeamChange.pdb "$PKG_DIR/"
          fi
          cd dist
          zip -r BlockTeamChange.zip BlockTeamChange

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockTeamChange
          path: dist/BlockTeamChange.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BlockTeamChange.zip
